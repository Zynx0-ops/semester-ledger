<title>Semester Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap">

<script>
/* Resolve appearance before first paint so a dark viewer never sees a light flash. */
(function(){
  try{
    var s = JSON.parse(localStorage.getItem("semester-ledger/v1") || "{}");
    var pref = (s && s.settings && s.settings.theme) || "system";
    var root = document.documentElement;
    var dark = pref === "dark" || (pref === "system" && (
      root.getAttribute("data-theme") === "dark" ||
      (root.getAttribute("data-theme") !== "light" &&
       window.matchMedia("(prefers-color-scheme: dark)").matches)
    ));
    root.setAttribute("data-appearance", dark ? "dark" : "light");
    /* data saved before the glass redesign (v<3) opens in Ivory, matching the new look */
    var legacy = !(s && +s.v >= 3);
    var accent = legacy ? "ivory" : ((s && s.settings && s.settings.accent) || "ivory");
    var map = {ivory:[["#1C1815","#F7F4EE"],["#F1ECE3","#15120E"]],
               blue:[["#007AFF","#FFFFFF"],["#0A84FF","#FFFFFF"]],purple:[["#AF52DE","#FFFFFF"],["#BF5AF2","#FFFFFF"]],
               pink:[["#FF2D55","#FFFFFF"],["#FF375F","#FFFFFF"]],red:[["#FF3B30","#FFFFFF"],["#FF453A","#FFFFFF"]],
               orange:[["#FF9500","#FFFFFF"],["#FF9F0A","#1A1206"]],yellow:[["#E6B400","#1A1406"],["#FFD60A","#1A1406"]],
               green:[["#34C759","#FFFFFF"],["#30D158","#06170D"]],teal:[["#0FA3B1","#FFFFFF"],["#40C8E0","#04161A"]],
               indigo:[["#5856D6","#FFFFFF"],["#5E5CE6","#FFFFFF"]]};
    var c = (map[accent] || map.ivory)[dark ? 1 : 0];
    root.style.setProperty("--accent", c[0]);
    root.style.setProperty("--accent-ink", c[1]);
  }catch(e){}
})();
</script>

<style>
/* ===========================================================
   Semester Ledger — dark glass, cream on near-black.
   Dark is the designed state; light is its warm-paper twin.
   =========================================================== */
:root{
  /* light: warm paper */
  --bg:#EFEBE4;
  --glow1:rgba(255,255,255,.95);
  --glow2:rgba(255,255,255,.45);
  --card:rgba(255,255,255,.66);
  --card-2:rgba(255,255,255,.92);
  --brd:rgba(28,24,20,.10);
  --brd-2:rgba(28,24,20,.17);
  --fill:rgba(28,24,20,.05);
  --fill-2:rgba(28,24,20,.09);
  --sep:rgba(28,24,20,.10);
  --label:#1C1815;
  --label2:rgba(28,24,21,.60);
  --label3:rgba(28,24,21,.40);
  --seg-active:#FFFFFF;
  --seg-shadow:0 2px 6px rgba(28,24,20,.14);
  --red:#BE3C2B;
  --orange:#A2701A;
  --green:#2E7A55;
  --knob:#FFFFFF;
  --shadow:0 16px 44px rgba(28,24,20,.11);
  --sheet-shadow:0 30px 70px rgba(28,24,20,.28);
  --accent:#1C1815;
  --accent-ink:#F7F4EE;

  --f:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --row-pad:13px;
  --r-card:22px;
  --r-field:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-appearance="light"]){
    --bg:#0B0A09;
    --glow1:rgba(255,248,236,.085);
    --glow2:rgba(255,248,236,.026);
    --card:rgba(255,252,246,.032);
    --card-2:rgba(255,252,246,.062);
    --brd:rgba(255,250,242,.085);
    --brd-2:rgba(255,250,242,.15);
    --fill:rgba(255,250,242,.055);
    --fill-2:rgba(255,250,242,.10);
    --sep:rgba(255,250,242,.072);
    --label:#F3EEE5;
    --label2:rgba(243,238,229,.56);
    --label3:rgba(243,238,229,.33);
    --seg-active:rgba(255,250,242,.13);
    --seg-shadow:0 2px 8px rgba(0,0,0,.4);
    --red:#FF6E5C;
    --orange:#EFA850;
    --green:#5FD09B;
    --knob:#F3EEE5;
    --shadow:0 20px 54px rgba(0,0,0,.55);
    --sheet-shadow:0 30px 80px rgba(0,0,0,.7);
    --accent:#F1ECE3;
    --accent-ink:#15120E;
  }
}
:root[data-appearance="dark"]{
  --bg:#0B0A09;
  --glow1:rgba(255,248,236,.085);
  --glow2:rgba(255,248,236,.026);
  --card:rgba(255,252,246,.032);
  --card-2:rgba(255,252,246,.062);
  --brd:rgba(255,250,242,.085);
  --brd-2:rgba(255,250,242,.15);
  --fill:rgba(255,250,242,.055);
  --fill-2:rgba(255,250,242,.10);
  --sep:rgba(255,250,242,.072);
  --label:#F3EEE5;
  --label2:rgba(243,238,229,.56);
  --label3:rgba(243,238,229,.33);
  --seg-active:rgba(255,250,242,.13);
  --seg-shadow:0 2px 8px rgba(0,0,0,.4);
  --red:#FF6E5C;
  --orange:#EFA850;
  --green:#5FD09B;
  --knob:#F3EEE5;
  --shadow:0 20px 54px rgba(0,0,0,.55);
  --sheet-shadow:0 30px 80px rgba(0,0,0,.7);
  --accent:#F1ECE3;
  --accent-ink:#15120E;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;
  color:var(--label);
  font-family:var(--f);
  font-optical-sizing:auto;
  font-size:16px;
  line-height:1.45;
  letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 640px at 10% -12%, var(--glow1), transparent 62%),
    radial-gradient(900px 520px at 90% 2%, var(--glow2), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  min-height:100vh;
}
button,input,select,textarea{font:inherit;font-family:var(--f);color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 65%,transparent);outline-offset:3px;border-radius:8px}
::selection{background:color-mix(in srgb,var(--accent) 26%,transparent)}

/* the small tracked labels the whole design hangs on */
.mlabel{font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--label3);line-height:1}
.mlabel.dim{color:var(--label3);opacity:.72;text-transform:none;letter-spacing:.02em;font-weight:500}

/* ---------------- header ---------------- */
.nav{position:sticky;top:0;z-index:20;transition:background .25s,border-color .25s,backdrop-filter .25s;
  border-bottom:1px solid transparent;background:transparent}
.nav.stuck{background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom-color:var(--brd);
  -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%)}
.nav-in{max-width:1080px;margin:0 auto;padding:30px clamp(18px,4vw,34px) 20px;display:flex;align-items:flex-start;gap:18px}
.nav.stuck .nav-in{padding-top:14px;padding-bottom:12px}
.nav-txt{flex:1 1 auto;min-width:0}
h1{margin:0;font-size:clamp(38px,6vw,54px);line-height:.98;font-weight:700;letter-spacing:-.037em}
.nav.stuck h1{font-size:clamp(26px,4vw,32px)}
.eyebrow{margin:8px 0 0;font-size:15px;font-weight:400;color:var(--label2);letter-spacing:-.008em}
.nav.stuck .eyebrow{display:none}
.nav-actions{display:flex;gap:9px;flex:none;padding-top:4px}
.icon-btn{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:50%;
  background:var(--card);border:1px solid var(--brd);color:var(--label2);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  transition:color .18s,border-color .18s,transform .12s}
.icon-btn:hover{color:var(--label);border-color:var(--brd-2)}
.icon-btn:active{transform:scale(.93)}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------------- layout ---------------- */
.wrap{max-width:1080px;margin:0 auto;padding:6px clamp(18px,4vw,34px) 96px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}

/* ---------------- glass card ---------------- */
.card{
  background:linear-gradient(158deg,var(--card-2),var(--card) 58%);
  border:1px solid var(--brd);
  border-radius:var(--r-card);
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(26px) saturate(140%);
  backdrop-filter:blur(26px) saturate(140%);
  overflow:hidden;
}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 19px 0}

/* ---------------- groups & rows ---------------- */
.group{margin:0 0 20px}
.group-hdr{margin:0 0 9px;padding:0 6px;display:flex;align-items:center;gap:8px;
  font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--label3)}
.group-hdr .count{margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.group.late .group-hdr{color:var(--red)}
.rows{list-style:none;margin:0;padding:0}

.row{position:relative;display:flex;align-items:flex-start;gap:13px;padding:var(--row-pad) 17px}
.row+.row::before{content:"";position:absolute;top:0;left:53px;right:17px;height:1px;background:var(--sep)}
.row-main{flex:1 1 auto;min-width:0;display:block;text-align:left;background:none;border:0;padding:0;margin:0}
.row-title{display:block;font-size:16.5px;line-height:1.32;letter-spacing:-.014em;word-break:break-word}
.row-note{display:block;font-size:13.5px;color:var(--label2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 11px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--label2)}
.cdot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--label3));flex:none}
.when{font-size:12.5px;color:var(--label2);font-variant-numeric:tabular-nums}
.when.late{color:var(--red)}
.when.now{color:var(--label);font-weight:500}
.row.done .row-title{color:var(--label3);text-decoration:line-through;text-decoration-thickness:1px}
.row.done .row-note,.row.done .when{color:var(--label3)}
.row-tail{flex:none;display:flex;align-items:center;gap:9px;padding-top:3px;color:var(--label3)}
.flag{font-size:12.5px;font-weight:700;letter-spacing:.04em}
.flag.p1{color:var(--orange)}
.flag.p2{color:var(--red)}
.chev{width:7px;height:12px;flex:none;opacity:.45}
.chev svg{width:100%;height:100%;fill:none;stroke:var(--label3);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.tick{width:23px;height:23px;flex:none;margin-top:1px;padding:0;display:grid;place-items:center;
  background:transparent;border:1.5px solid var(--brd-2);border-radius:7px;
  transition:background .18s,border-color .18s,transform .12s}
:root[data-tick="circle"] .tick{border-radius:50%}
.tick:hover{border-color:var(--accent)}
.tick:active{transform:scale(.88)}
.tick svg{width:13px;height:13px;fill:none;stroke:var(--accent-ink);stroke-width:2.9;
  stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;
  transition:stroke-dashoffset .2s ease}
.tick[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.tick[aria-checked="true"] svg{stroke-dashoffset:0}
:root[data-density="compact"]{--row-pad:8px}

/* ---------------- composer ---------------- */
.compose{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(118px,.8fr) auto;
  gap:14px 12px;padding:18px 19px 19px;align-items:end}
.compose .f-title{grid-column:1/-1}
.cfield{display:flex;flex-direction:column;gap:8px;min-width:0}
.cfield .mlabel{padding-left:2px}
.field{width:100%;min-width:0;background:var(--fill);color:var(--label);
  border:1px solid var(--brd);border-radius:var(--r-field);padding:12px 14px;font-size:15px}
.field::placeholder{color:var(--label3)}
.field:focus{outline:none;border-color:var(--brd-2);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--accent) 16%,transparent)}
.field:disabled{opacity:.45}
input[type="date"].field,input[type="time"].field{font-variant-numeric:tabular-nums}
select.field{-webkit-appearance:none;appearance:none;padding-right:34px;
  background-image:linear-gradient(45deg,transparent 50%,var(--label2) 50%),linear-gradient(135deg,var(--label2) 50%,transparent 50%);
  background-position:calc(100% - 19px) 53%,calc(100% - 14px) 53%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.btn{border:1px solid var(--accent);border-radius:999px;padding:12px 22px;background:var(--accent);
  color:var(--accent-ink);font-size:15px;font-weight:600;letter-spacing:-.008em;white-space:nowrap;
  transition:filter .16s,transform .1s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.38;filter:none}
.btn-plain{background:var(--fill);border-color:var(--brd);color:var(--label)}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}

/* ---------------- rail ---------------- */
.rail{position:sticky;top:96px;display:flex;flex-direction:column;gap:22px}
.ring-card{display:flex;flex-direction:column;align-items:center;padding-bottom:20px}
.ring-card .card-top{width:100%}
.ring{position:relative;width:176px;height:176px;margin-top:12px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--fill-2);stroke-width:9}
.ring .arc{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;
  transition:stroke-dashoffset .7s cubic-bezier(.22,.68,0,1),stroke .2s}
.ring-mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.pct{font-size:50px;font-weight:700;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.pct sup{font-size:17px;font-weight:600;color:var(--label3);vertical-align:super;margin-left:1px;letter-spacing:-.02em}
.ring-sub{margin:14px 0 0;font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}
.ring-scope{margin:5px 0 0;font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  color:var(--label3);text-align:center;padding:0 14px}

.card-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 14px 10px 19px}
.card-hd h2{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--label3)}
.card-hd button{background:none;border:0;padding:3px 6px;border-radius:8px;color:var(--label2);
  font-size:12.5px;font-weight:600;letter-spacing:-.004em}
.card-hd button:hover{color:var(--label)}
.classes{display:flex;flex-direction:column}
.cls-row{position:relative;display:flex;align-items:center;gap:0;transition:transform .2s cubic-bezier(.32,.72,0,1)}
.cls-row+.cls-row::before{content:"";position:absolute;top:0;left:19px;right:19px;height:1px;background:var(--sep)}
.cls-row.active{background:var(--fill)}
.cls-row.dragging{transition:none;z-index:5;background:var(--card-2);border-radius:14px;
  box-shadow:0 14px 34px rgba(0,0,0,.4)}
.cls-row.dragging::before{opacity:0}
.classes.editing .cls{pointer-events:none}
.cls{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 6px 12px 19px;
  background:none;border:0;text-align:left}
.cls-ico{width:27px;height:27px;flex:none;border-radius:50%;background:var(--c,var(--label3));
  display:grid;place-items:center;font-size:12px;line-height:1;color:#fff;font-weight:600}
.cls-ico.all{background:var(--accent);color:var(--accent-ink)}
.cls-body{flex:1 1 auto;min-width:0}
.cls-name{display:block;font-size:14.5px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cls-row.active .cls-name{font-weight:600}
.cls-bar{display:block;height:2px;border-radius:2px;background:var(--fill-2);margin-top:7px;overflow:hidden}
.cls-bar i{display:block;height:100%;border-radius:2px;background:var(--c,var(--accent));
  transition:width .6s cubic-bezier(.22,.68,0,1)}
.cls-frac{flex:none;font-size:12px;color:var(--label3);font-variant-numeric:tabular-nums;padding-right:6px}
.cls-edit{flex:none;background:none;border:0;padding:12px 16px 12px 6px;color:var(--label3);line-height:0}
.cls-edit:hover{color:var(--label)}
.cls-edit svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.grip{flex:none;background:none;border:0;padding:12px 16px 12px 6px;color:var(--label3);
  line-height:0;touch-action:none;cursor:grab}
.grip:active{cursor:grabbing}
.grip:hover{color:var(--label2)}
.grip svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.add-cls{width:100%;display:flex;align-items:center;gap:12px;padding:14px 19px;background:none;border:0;
  color:var(--label2);font-size:14.5px;position:relative;transition:color .16s}
.add-cls:hover{color:var(--label)}
.add-cls::before{content:"";position:absolute;top:0;left:19px;right:19px;height:1px;background:var(--sep)}
.add-cls .plus{width:27px;height:27px;flex:none;border-radius:50%;background:var(--fill-2);
  display:grid;place-items:center;font-size:16px;font-weight:400;line-height:1}

/* ---------------- empty, completed, footer ---------------- */
.empty{padding:52px 30px;text-align:center}
.empty-ico{width:54px;height:54px;margin:0 auto 18px;border-radius:50%;background:var(--fill-2);
  display:grid;place-items:center}
.empty-ico svg{width:25px;height:25px;fill:none;stroke:var(--label3);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.empty h2{margin:0 0 7px;font-size:21px;font-weight:600;letter-spacing:-.024em}
.empty p{margin:0 auto;max-width:34ch;font-size:14.5px;color:var(--label2);line-height:1.5}
.done-bar{margin:2px 0 14px;display:flex}
.done-toggle{display:flex;align-items:center;gap:8px;background:none;border:0;padding:5px 6px;
  font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--label3)}
.done-toggle:hover{color:var(--label2)}
.done-toggle .tri{display:inline-block;transition:transform .2s;font-size:9px}
.done-toggle[aria-expanded="true"] .tri{transform:rotate(90deg)}
.foot{padding:10px 6px;font-size:12.5px;color:var(--label3);font-variant-numeric:tabular-nums}

/* ---------------- sheets ---------------- */
dialog.sheet{border:0;padding:0;background:transparent;max-width:none;max-height:none;
  width:100%;height:100%;margin:0;overflow:visible;color:var(--label)}
dialog.sheet::backdrop{background:rgba(6,5,4,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet-pos{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px}
.sheet-box{width:100%;max-width:440px;max-height:min(86vh,740px);overflow-y:auto;
  background:linear-gradient(168deg,var(--card-2),var(--card) 60%),var(--bg);
  border:1px solid var(--brd);border-radius:24px;box-shadow:var(--sheet-shadow);
  -webkit-backdrop-filter:blur(30px) saturate(150%);backdrop-filter:blur(30px) saturate(150%);
  -webkit-overflow-scrolling:touch}
.sheet-hdr{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:17px 19px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border-bottom:1px solid var(--sep)}
.sheet-hdr h2{margin:0;flex:1 1 auto;font-size:15px;font-weight:600;letter-spacing:-.014em;text-align:center}
.sheet-hdr button{background:none;border:0;padding:4px;color:var(--label2);font-size:15px}
.sheet-hdr button:hover{color:var(--label)}
.sheet-hdr button.strong{font-weight:600;color:var(--label)}
.sheet-hdr button:disabled{opacity:.4}
.sheet-body{padding:19px}
.sec{margin:0 0 22px}
.sec-hdr{margin:0 0 9px;padding:0 6px;font-size:10.5px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--label3)}
.srow{position:relative;display:flex;align-items:center;gap:12px;padding:13px 17px;min-height:46px}
.srow+.srow::before{content:"";position:absolute;top:0;left:17px;right:17px;height:1px;background:var(--sep)}
.srow-label{flex:1 1 auto;font-size:15px;letter-spacing:-.011em}
.srow-hint{display:block;font-size:12.5px;color:var(--label2);margin-top:2px;letter-spacing:-.004em}
.srow.tap{width:100%;background:none;border:0;text-align:left;color:var(--label);font-size:15px}
.srow.tap:hover{background:var(--fill)}
.srow.tap.danger{color:var(--red)}
.srow.stack{flex-direction:column;align-items:stretch;gap:11px}
.srow-field{display:block;padding:11px 17px}
.srow-field .field{background:transparent;border-color:transparent;padding:4px 0;font-size:15.5px}
.srow-field .field:focus{box-shadow:none;border-color:transparent}
textarea.field{resize:vertical;min-height:64px;line-height:1.45}

.switch{position:relative;width:50px;height:30px;flex:none;border:0;border-radius:999px;

  background:var(--knob);box-shadow:0 2px 6px rgba(0,0,0,.25);
  transition:transform .22s cubic-bezier(.32,.72,0,1),background .22s}
.switch[aria-checked="true"] .knob{transform:translateX(20px);background:var(--accent-ink)}

.swatches{display:flex;flex-wrap:wrap;gap:11px;padding:14px 17px}
.sw{width:29px;height:29px;border-radius:50%;border:1px solid var(--brd);padding:0;position:relative;
  transition:transform .12s}
.sw:hover{transform:scale(1.1)}
.sw::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid transparent;transition:border-color .16s}
.sw[aria-pressed="true"]::after{border-color:var(--label2)}
.sw .mark{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700;opacity:0}
.sw[aria-pressed="true"] .mark{opacity:1}
.icon-picker{display:flex;flex-wrap:wrap;gap:8px;padding:12px 17px}
.icon-opt{width:35px;height:35px;border-radius:11px;border:1px solid var(--brd);background:var(--fill);
  font-size:17px;line-height:1;padding:0}
.icon-opt[aria-pressed="true"]{background:var(--fill-2);box-shadow:inset 0 0 0 1.5px var(--accent)}

/* ---------------- toast ---------------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  z-index:60;display:flex;align-items:center;gap:16px;max-width:min(92vw,440px);
  padding:14px 18px;border-radius:16px;background:rgba(18,16,14,.92);color:#F3EEE5;
  border:1px solid rgba(255,250,242,.1);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  box-shadow:0 18px 44px rgba(0,0,0,.5);font-size:14.5px;
  transition:opacity .22s,transform .22s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:#F3EEE5;font-weight:600;font-size:14.5px;
  white-space:nowrap;text-decoration:underline;text-underline-offset:3px}

/* class colour, the one place chroma is spent */
.ghdr-ico{width:16px;height:16px;flex:none;border-radius:50%;background:var(--c,var(--label3));
  display:grid;place-items:center;font-size:9px;line-height:1;color:#fff;font-weight:700}
.row[data-tint] .tick{border-color:var(--tc)}
.row[data-tint] .tick:hover{border-color:var(--tc);filter:brightness(1.3)}
.row[data-tint] .tick[aria-checked="true"]{background:var(--tc);border-color:var(--tc)}

/* ---------------- responsive ---------------- */

  .cols{display:flex;flex-direction:column;gap:20px;align-items:stretch}

<script>
(function(){
"use strict";

/* ===================== constants ===================== */
/* c = the accent, on = text/marks drawn on top of it (chosen per theme for contrast) */
var ACCENTS = [
  {id:"ivory",  name:"Ivory",  light:{c:"#1C1815",on:"#F7F4EE"}, dark:{c:"#F1ECE3",on:"#15120E"}},
  {id:"blue",   name:"Blue",   light:{c:"#007AFF",on:"#FFFFFF"}, dark:{c:"#0A84FF",on:"#FFFFFF"}},
  {id:"purple", name:"Purple", light:{c:"#AF52DE",on:"#FFFFFF"}, dark:{c:"#BF5AF2",on:"#FFFFFF"}},
  {id:"pink",   name:"Pink",   light:{c:"#FF2D55",on:"#FFFFFF"}, dark:{c:"#FF375F",on:"#FFFFFF"}},
  {id:"red",    name:"Red",    light:{c:"#FF3B30",on:"#FFFFFF"}, dark:{c:"#FF453A",on:"#FFFFFF"}},
  {id:"orange", name:"Orange", light:{c:"#FF9500",on:"#FFFFFF"}, dark:{c:"#FF9F0A",on:"#1A1206"}},
  {id:"yellow", name:"Yellow", light:{c:"#E6B400",on:"#1A1406"}, dark:{c:"#FFD60A",on:"#1A1406"}},
  {id:"green",  name:"Green",  light:{c:"#34C759",on:"#FFFFFF"}, dark:{c:"#30D158",on:"#06170D"}},
  {id:"teal",   name:"Teal",   light:{c:"#0FA3B1",on:"#FFFFFF"}, dark:{c:"#40C8E0",on:"#04161A"}},
  {id:"indigo", name:"Indigo", light:{c:"#5856D6",on:"#FFFFFF"}, dark:{c:"#5E5CE6",on:"#FFFFFF"}}
];
var CLASS_COLORS = ["#007AFF","#AF52DE","#FF2D55","#FF3B30","#FF9500","#E6B400","#34C759","#0FA3B1","#5856D6"];
var ICONS = ["","📘","🔬","🧪","📐","🧮","🌍","🎨","🎵","💻","📖","✍️","🏛️","🧠","⚽","🗣️"];
var LS_KEY = "semester-ledger/v1";
var DATA_PATH = "data/planner.json";
var WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var WD3 = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MO = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var MO3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var BUCKETS = [["overdue","Overdue"],["today","Today"],["tomorrow","Tomorrow"],["week","This Week"],["later","Later"],["someday","No Date"]];

var DEFAULTS = {
  theme:"system", accent:"ivory", tick:"square", density:"comfortable",
  groupBy:"due", sort:"due", showCompleted:true
};

/* ===================== state ===================== */
var state = blank();
var filter = "all";
var showDone = false;
var editingTask = null;
var editingClass = null;
var api = null, mode = "local", saveTimer = null, backoff = 1400, retried = false;
var toastTimer = null, mediaQuery = null, themeObserver = null;
var orderEditing = false, reorder = null;

function blank(){ return {v:3, classes:[], tasks:[], settings:copy(DEFAULTS), updatedAt:0}; }
function copy(o){ var r={},k; for(k in o) if(Object.prototype.hasOwnProperty.call(o,k)) r[k]=o[k]; return r; }

/* ===================== utils ===================== */
function $(id){ return document.getElementById(id); }
function pad(n){ return String(n).length<2 ? "0"+n : String(n); }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function isoOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseISO(iso){ var p=iso.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function shiftISO(iso,n){ var d=parseISO(iso); d.setDate(d.getDate()+n); return isoOf(d); }

var TODAY = isoOf(new Date());
var TOMORROW = shiftISO(TODAY,1);
var WEEK_END = shiftISO(TODAY,7);

function fmtDate(iso){
  if(!iso) return "";
  if(iso===TODAY) return "Today";
  if(iso===TOMORROW) return "Tomorrow";
  if(iso===shiftISO(TODAY,-1)) return "Yesterday";
  var d=parseISO(iso);
  var s=WD3[d.getDay()]+", "+MO3[d.getMonth()]+" "+d.getDate();
  if(d.getFullYear()!==new Date().getFullYear()) s+=" "+d.getFullYear();
  return s;
}
function fmtTime(t){
  if(!t) return "";
  var p=t.split(":"), h=+p[0], m=p[1];
  var ap = h>=12 ? "PM" : "AM";
  h = h%12; if(h===0) h=12;
  return h+":"+m+" "+ap;
}
function classOf(id){ for(var i=0;i<state.classes.length;i++) if(state.classes[i].id===id) return state.classes[i]; return null; }
function taskOf(id){ for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].id===id) return state.tasks[i]; return null; }
function setting(k){ var v=state.settings&&state.settings[k]; return v===undefined?DEFAULTS[k]:v; }

function bucketOf(t){
  if(!t.due) return "someday";
  if(t.due<TODAY) return "overdue";
  if(t.due===TODAY) return "today";
  if(t.due===TOMORROW) return "tomorrow";
  if(t.due<=WEEK_END) return "week";
  return "later";
}
function cmpDue(a,b){
  if(!a.due !== !b.due) return a.due ? -1 : 1;
  if(a.due!==b.due) return a.due<b.due ? -1 : 1;
  if(!a.time !== !b.time) return a.time ? -1 : 1;
  if(a.time!==b.time) return a.time<b.time ? -1 : 1;
  return (a.createdAt||0)-(b.createdAt||0);
}
function comparator(){
  var s=setting("sort");
  if(s==="priority") return function(a,b){ return (b.priority||0)-(a.priority||0) || cmpDue(a,b); };
  if(s==="name")     return function(a,b){ return a.title.localeCompare(b.title,undefined,{sensitivity:"base"}); };
  if(s==="added")    return function(a,b){ return (b.createdAt||0)-(a.createdAt||0); };
  return cmpDue;
}

/* ===================== persistence ===================== */
function readLocal(){
  try{ var raw=localStorage.getItem(LS_KEY); return raw ? normalize(JSON.parse(raw)) : null; }
  catch(e){ return null; }
}
function writeLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

/* Accepts v1 (no settings, no note/priority/icon) and fills defaults. */
function normalize(o){
  if(!o || typeof o!=="object") return null;
  var out = {v:3, classes:[], tasks:[], settings:copy(DEFAULTS), updatedAt:+o.updatedAt||0};
  var preGlass = !(+o.v >= 3);
  var inS = o.settings && typeof o.settings==="object" ? o.settings : {};
  Object.keys(DEFAULTS).forEach(function(k){
    var v=inS[k];
    if(k==="showCompleted"){ if(typeof v==="boolean") out.settings[k]=v; return; }
    if(typeof v==="string" && v) out.settings[k]=v;
  });
  /* The glass redesign is monochrome by intent, so data saved before it opens in
     Ivory. It runs once: the next save writes v3 and any later accent choice stays. */
  if(preGlass) out.settings.accent="ivory";
  (Array.isArray(o.classes)?o.classes:[]).forEach(function(c,i){
    if(!c||!c.id||!c.name) return;
    out.classes.push({
      id:String(c.id),
      name:String(c.name).slice(0,60),
      color:String(c.color||CLASS_COLORS[i%CLASS_COLORS.length]),
      icon: typeof c.icon==="string" ? c.icon.slice(0,4) : ""
    });
  });
  (Array.isArray(o.tasks)?o.tasks:[]).forEach(function(t){
    if(!t||!t.id||!t.title) return;
    var p=+t.priority; if(!(p===1||p===2)) p=0;
    out.tasks.push({
      id:String(t.id),
      classId: t.classId ? String(t.classId) : null,
      title:String(t.title).slice(0,300),
      note: typeof t.note==="string" ? t.note.slice(0,2000) : "",
      due: t.due ? String(t.due).slice(0,10) : null,
      time: t.time ? String(t.time).slice(0,5) : null,
      done: !!t.done, doneAt: t.doneAt||null, priority:p,
      createdAt:+t.createdAt||0
    });
  });
  return out;
}

var PERMANENT = ["not_writer","not_granted","not_declared","capability_disabled","capability_removed",
                 "consent_required","invalid_content","transform_error","read_only_path","too_large"];

function scheduleSave(delay){
  if(mode!=="cloud"||!api) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, delay===undefined?1400:delay);
}
function doSave(){
  if(!api) return;
  var files={}; files[DATA_PATH]=JSON.stringify(state);
  api.publish(files).then(function(){ backoff=1400; retried=false; }, function(err){
    var code=(err&&err.code)||"upstream_error";
    if(code==="conflict") return;
    if(PERMANENT.indexOf(code)!==-1){ mode="local"; api=null; return; }
    if(code==="rate_limited"){ backoff=Math.min(backoff*2,20000); scheduleSave(backoff); return; }
    if(!retried){ retried=true; scheduleSave(1200+Math.random()*1500); }
  });
}
function commit(){
  state.updatedAt = Date.now();
  writeLocal();
  render();
  scheduleSave();
}

/* ===================== appearance ===================== */
function resolvedDark(){
  var pref = setting("theme");
  if(pref==="dark") return true;
  if(pref==="light") return false;
  var host = document.documentElement.getAttribute("data-theme");
  if(host==="dark") return true;
  if(host==="light") return false;
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function applyAppearance(){
  var root=document.documentElement, dark=resolvedDark();
  root.setAttribute("data-appearance", dark?"dark":"light");
  root.setAttribute("data-tick", setting("tick"));
  root.setAttribute("data-density", setting("density"));
  var a=null, id=setting("accent");
  for(var i=0;i<ACCENTS.length;i++) if(ACCENTS[i].id===id) a=ACCENTS[i];
  if(!a) a=ACCENTS[0];
  var v = dark ? a.dark : a.light;
  root.style.setProperty("--accent", v.c);
  root.style.setProperty("--accent-ink", v.on);
}
function watchSystemTheme(){
  if(window.matchMedia){
    mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange=function(){ if(setting("theme")==="system") applyAppearance(); };
    if(mediaQuery.addEventListener) mediaQuery.addEventListener("change",onChange);
    else if(mediaQuery.addListener) mediaQuery.addListener(onChange);
  }
  themeObserver = new MutationObserver(function(){ if(setting("theme")==="system") applyAppearance(); });
  themeObserver.observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
}

/* ===================== small builders ===================== */
function seg(name,opts,current){
  var h='<div class="seg" role="radiogroup" data-seg="'+name+'">';
  opts.forEach(function(o){
    h+='<button type="button" role="radio" data-val="'+esc(o[0])+'" aria-checked="'+(o[0]===current)+'">'+esc(o[1])+"</button>";
  });
  return h+"</div>";
}
function segValue(root,name){
  var el=root.querySelector('[data-seg="'+name+'"] button[aria-checked="true"]');
  return el ? el.getAttribute("data-val") : null;
}
function switchHTML(name,on){
  return '<button type="button" class="switch" role="switch" data-switch="'+name+'" aria-checked="'+(!!on)+
         '"><span class="knob"></span></button>';
}
var CHECK_SVG = '<svg viewBox="0 0 16 16"><path d="M3 8.4l3.3 3.3L13 4.9"/></svg>';
var CHEV_SVG  = '<span class="chev"><svg viewBox="0 0 8 13"><path d="M1.5 1.5L6 6.5l-4.5 5"/></svg></span>';

function clsIcon(c,extra){
  var glyph = c.icon ? esc(c.icon) : esc((c.name||"?").trim().charAt(0).toUpperCase());
  return '<span class="cls-ico '+(extra||"")+'" style="--c:'+esc(c.color)+'">'+glyph+"</span>";
}

/* ===================== rendering ===================== */
function inScope(t){ return filter==="all" || t.classId===filter; }
function progressFor(list){
  var done=0; for(var i=0;i<list.length;i++) if(list[i].done) done++;
  return {total:list.length, done:done, pct:list.length?Math.round(done/list.length*100):0};
}

function render(){
  applyAppearance();
  renderComposer();
  renderList();
  renderRing();
  renderClasses();
  renderFoot();
}

function renderComposer(){
  var sel=$("cClass"), keep=sel.value, none=!state.classes.length;
  sel.innerHTML = none ? '<option value="">No classes</option>'
    : state.classes.map(function(c){ return '<option value="'+esc(c.id)+'">'+esc(c.name)+"</option>"; }).join("");
  if(keep && classOf(keep)) sel.value=keep;
  else if(filter!=="all" && classOf(filter)) sel.value=filter;
  ["cTitle","cClass","cDate","cTime","cAdd"].forEach(function(id){ $(id).disabled=none; });
  $("cTitle").placeholder = none ? "Add a class first" : "New task";
}

function rowHTML(t){
  var c=classOf(t.classId);
  var when="";
  if(t.due||t.time){
    var k="when";
    if(!t.done){ if(t.due&&t.due<TODAY) k+=" late"; else if(t.due===TODAY) k+=" now"; }
    var txt=t.due?fmtDate(t.due):"";
    if(t.time) txt+=(txt?" at ":"")+fmtTime(t.time);
    when='<span class="'+k+'">'+esc(txt)+"</span>";
  }
  var chip="";
  if(c && setting("groupBy")!=="class"){
    chip='<span class="chip"><i class="cdot" style="--c:'+esc(c.color)+'"></i>'+esc(c.name)+"</span>";
  }
  var sub = (chip||when) ? '<span class="row-sub">'+chip+when+"</span>" : "";
  var note = t.note ? '<span class="row-note">'+esc(t.note)+"</span>" : "";
  var flag = t.priority && !t.done
    ? '<span class="flag p'+t.priority+'">'+(t.priority===2?"!!":"!")+"</span>" : "";

  var tint = (setting("groupBy")==="class" && c)
    ? ' data-tint="1" style="--tc:'+esc(c.color)+'"' : "";
  return '<li class="row'+(t.done?" done":"")+'"'+tint+' data-tid="'+esc(t.id)+'">'
    + '<button class="tick" role="checkbox" aria-checked="'+(t.done?"true":"false")+'" data-act="toggle" data-id="'+esc(t.id)+'"'
    + ' aria-label="'+(t.done?"Mark not completed":"Mark completed")+': '+esc(t.title)+'">'+CHECK_SVG+"</button>"
    + '<button class="row-main" data-act="open" data-id="'+esc(t.id)+'">'
    + '<span class="row-title">'+esc(t.title)+"</span>"+note+sub+"</button>"
    + '<span class="row-tail">'+flag+CHEV_SVG+"</span></li>";
}

function groupsFor(list){
  var out=[], cmp=comparator();
  if(setting("groupBy")==="class"){
    state.classes.forEach(function(c){
      var g=list.filter(function(t){ return t.classId===c.id; });
      if(g.length) out.push({key:c.id, label:c.name, late:false, cls:c, items:g.sort(cmp)});
    });
    var orphan=list.filter(function(t){ return !classOf(t.classId); });
    if(orphan.length) out.push({key:"none", label:"No Class", late:false, cls:null, items:orphan.sort(cmp)});
  }else{
    var by={};
    list.forEach(function(t){ (by[bucketOf(t)]=by[bucketOf(t)]||[]).push(t); });
    BUCKETS.forEach(function(p){
      if(by[p[0]] && by[p[0]].length)
        out.push({key:p[0], label:p[1], late:p[0]==="overdue", cls:null, items:by[p[0]].sort(cmp)});
    });
  }
  return out;
}

function groupIcon(g){
  if(!g.cls) return "";
  var c=g.cls;
  var glyph = c.icon ? esc(c.icon) : esc((c.name||"?").trim().charAt(0).toUpperCase());
  return '<span class="ghdr-ico" style="--c:'+esc(c.color)+'">'+glyph+"</span>";
}

function renderList(){
  var host=$("list");

      + '<div class="empty-ico"><svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10l1.5 2H18.5A1.5 1.5 0 0 1 20 7.5v11A1.5 1.5 0 0 1 18.5 20h-13A1.5 1.5 0 0 1 4 18.5z"/></svg></div>'

      + "</section>";
    $("doneBar").hidden=true; $("doneList").innerHTML="";
    return;
  }

  var open = state.tasks.filter(function(t){ return !t.done && inScope(t); });
  var groups = groupsFor(open);
  var html="";

    html += '<section class="group'+(g.late?" late":"")+'">'

    html = '<section class="card empty">'
      + '<div class="empty-ico"><svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></svg></div>'
      + "<h2>"+(anyDone?"All caught up":"Nothing scheduled")+"</h2><p>"
      + (anyDone ? "Everything"+esc(where)+" is checked off." : "No open tasks"+esc(where)+" yet — add one above.")
      + "</p></section>";
  }
  host.innerHTML = html;

  var done = state.tasks.filter(function(t){ return t.done && inScope(t); });
  var showSection = setting("showCompleted") && done.length>0;
  $("doneBar").hidden = !showSection;
  if(showSection){
    $("doneToggle").setAttribute("aria-expanded", showDone?"true":"false");

    done.sort(function(a,b){ return (b.doneAt||0)-(a.doneAt||0); });
    $("doneList").innerHTML = '<ul class="card rows">'+done.map(rowHTML).join("")+"</ul>";
  }else{
    $("doneList").innerHTML="";
  }
}

/* ===================== events ===================== */
document.addEventListener("click", function(e){
  if(!e.target||!e.target.closest) return;

  if(e.target.classList && e.target.classList.contains("sheet-pos")){
    var d=e.target.closest("dialog"); if(d) d.close(); return;
  }
  var closer=e.target.closest("[data-close]");
  if(closer){ var dc=closer.closest("dialog"); if(dc) dc.close(); return; }

  var segBtn=e.target.closest(".seg button");
  if(segBtn){
    var box=segBtn.closest(".seg"), name=box.getAttribute("data-seg");
    Array.prototype.forEach.call(box.querySelectorAll("button"),function(b){
      b.setAttribute("aria-checked", b===segBtn ? "true":"false");
    });
    if(box.closest("#settingsBody")){
      state.settings[name] = segBtn.getAttribute("data-val");
      if(name==="showCompleted") state.settings[name] = segBtn.getAttribute("data-val")==="true";
      commit();
      if(name==="theme"||name==="accent") renderSettings();
    }
    return;
  }

  var sw=e.target.closest(".switch");
  if(sw){
    var on = sw.getAttribute("aria-checked")!=="true";
    sw.setAttribute("aria-checked", on?"true":"false");
    var sname=sw.getAttribute("data-switch");
    if(sname){ state.settings[sname]=on; commit(); }
    return;
  }

  var acc=e.target.closest("[data-accent]");
  if(acc){ state.settings.accent=acc.getAttribute("data-accent"); commit(); renderSettings(); return; }

  var colBtn=e.target.closest("[data-color]");
  if(colBtn){
    var cbox=colBtn.closest(".swatches");
    Array.prototype.forEach.call(cbox.querySelectorAll(".sw"),function(b){
      b.setAttribute("aria-pressed", b===colBtn ? "true":"false");
    });
    return;
  }
  var icoBtn=e.target.closest("[data-icon]");
  if(icoBtn){
    var ibox=icoBtn.closest(".icon-picker");
    Array.prototype.forEach.call(ibox.querySelectorAll(".icon-opt"),function(b){
      b.setAttribute("aria-pressed", b===icoBtn ? "true":"false");
    });
    return;
  }

  var el=e.target.closest("[data-act]");
  if(!el) return;
  var act=el.getAttribute("data-act"), id=el.getAttribute("data-id");

  if(act==="toggle"){
    var t=taskOf(id); if(!t) return;
    t.done=!t.done; t.doneAt=t.done?Date.now():null;
    var had = document.activeElement===el;
    var vanished = t.done && !setting("showCompleted");
    commit();
    if(had){ var again=document.querySelector('.tick[data-id="'+id+'"]'); if(again) again.focus(); }
    if(vanished){
      toast("Completed \u201C"+t.title+"\u201D","Undo",function(){
        var back=taskOf(id);
        if(back){ back.done=false; back.doneAt=null; commit(); }
      });
    }
  }
  else if(act==="open"){ openTask(id); }
  else if(act==="filter"){ filter=id; render(); }
  else if(act==="editcls"){ openClass(id); }
  else if(act==="deltask"){
    var idx=state.tasks.findIndex(function(x){ return x.id===editingTask; });
    if(idx<0) return;
    var removed=state.tasks[idx];
    state.tasks.splice(idx,1);
    $("taskSheet").close(); editingTask=null;
    commit();
    toast("Deleted “"+removed.title+"”","Undo",function(){
      state.tasks.splice(Math.min(idx,state.tasks.length),0,removed); commit();
    });
  }
  else if(act==="delcls"){
    var c=classOf(editingClass); if(!c) return;
    var tasks=state.tasks.filter(function(x){ return x.classId===c.id; });
    var keptTasks=state.tasks, keptClasses=state.classes;
    state.tasks=state.tasks.filter(function(x){ return x.classId!==c.id; });
    state.classes=state.classes.filter(function(x){ return x.id!==c.id; });
    if(filter===c.id) filter="all";
    $("classSheet").close(); editingClass=null;
    commit();
    toast("Deleted "+c.name+(tasks.length?" and "+tasks.length+(tasks.length===1?" task":" tasks"):""),"Undo",function(){
      state.tasks=keptTasks; state.classes=keptClasses; commit();
    });
  }
  else if(act==="backup"){ downloadBackup(); }
});

/* Enter submits; the harness-independent path for every text field. */
document.addEventListener("keydown", function(e){

  if(!t||t.tagName!=="INPUT") return;

/* Drag with pointer events so one path covers mouse, trackpad and touch. */
function startReorder(e,id){
  var wrap=$("classes");
  var rows=Array.prototype.slice.call(wrap.querySelectorAll(".cls-row[data-cid]"));
  var from=-1;
  for(var i=0;i<rows.length;i++) if(rows[i].getAttribute("data-cid")===id) from=i;
  if(from<0) return;
  var rects=rows.map(function(r){ return r.getBoundingClientRect(); });
  reorder={id:id, rows:rows, rects:rects, from:from, to:from,
           startY:e.clientY, h:rects[from].height, moved:false};
  rows[from].classList.add("dragging");
  document.addEventListener("pointermove",onReorderMove);
  document.addEventListener("pointerup",endReorder);
  document.addEventListener("pointercancel",endReorder);
  if(e.preventDefault) e.preventDefault();
}
function onReorderMove(e){
  var r=reorder; if(!r) return;
  var dy=e.clientY-r.startY;
  if(Math.abs(dy)>2) r.moved=true;
  r.rows[r.from].style.transform="translateY("+dy+"px)";

  /* target index = how many other rows the dragged centre has passed */
  var centre=r.rects[r.from].top+r.rects[r.from].height/2+dy;
  var to=0;
  for(var i=0;i<r.rects.length;i++){
    if(i===r.from) continue;
    if(centre > r.rects[i].top+r.rects[i].height/2) to++;
  }
  r.to=to;

  /* open a gap where it would land */
  for(var j=0;j<r.rows.length;j++){
    if(j===r.from) continue;
    var shift=0;
    if(r.from<to && j>r.from && j<=to) shift=-r.h;
    else if(r.from>to && j>=to && j<r.from) shift=r.h;
    r.rows[j].style.transform = shift ? "translateY("+shift+"px)" : "";
  }
}
function endReorder(){
  var r=reorder; if(!r) return;
  reorder=null;
  document.removeEventListener("pointermove",onReorderMove);
  document.removeEventListener("pointerup",endReorder);
  document.removeEventListener("pointercancel",endReorder);
  r.rows.forEach(function(row){ row.style.transform=""; row.classList.remove("dragging"); });
  if(r.moved && r.to!==r.from) moveClass(r.from,r.to);
  else renderClasses();
}

document.addEventListener("pointerdown", function(e){
  if(!e.target||!e.target.closest) return;
  if(typeof e.button==="number" && e.button!==0) return;
  var g=e.target.closest('[data-act="grip"]');
  if(!g) return;
  startReorder(e,g.getAttribute("data-id"));
});

/* Arrow keys on a focused handle — the accessible path, and no drag needed. */
document.addEventListener("keydown", function(e){
  if(!e.target||!e.target.closest) return;
  var g=e.target.closest('[data-act="grip"]');
  if(!g) return;
  if(e.key!=="ArrowUp" && e.key!=="ArrowDown") return;
  e.preventDefault();
  var id=g.getAttribute("data-id");
  var i=indexOfClass(id);
  if(moveClass(i, i+(e.key==="ArrowUp"?-1:1))) focusGrip(id);
});

$("orderBtn").addEventListener("click", function(){
  orderEditing=!orderEditing;
  this.textContent = orderEditing ? "Done" : "Edit";
  renderClasses();
});

/* ===================== backup ===================== */
function downloadBackup(){
  var json=JSON.stringify(state,null,2);
  var name="semester-ledger-"+TODAY+".json";
  if(window.claude && typeof window.claude.use==="function"){
    window.claude.use("downloads").then(function(dl){
      if(dl) return dl.save({filename:name,data:json});
      anchorDownload(name,json);
    }).catch(function(){ anchorDownload(name,json); });
  }else{
    anchorDownload(name,json);
  }
}
function anchorDownload(name,json){
  try{
    var blob=new Blob([json],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },1000);
  }catch(e){ toast("Couldn’t prepare the backup file."); }
}

/* ===================== boot ===================== */
function loadRemote(){
  return fetch(DATA_PATH,{cache:"no-store"}).then(function(r){
    return r.ok ? r.text() : null;
  }).then(function(txt){ return txt ? normalize(JSON.parse(txt)) : null; })
   .catch(function(){ return null; });
}
function connect(){
  try{
    if(!(window.claude&&typeof window.claude.use==="function")) return Promise.resolve(null);
    return window.claude.use("artifact").catch(function(){ return null; });
  }catch(e){ return Promise.resolve(null); }
}

function watchScroll(){
  var nav=document.querySelector(".nav");
  if(!nav) return;
  var ticking=false;
  var update=function(){ nav.classList.toggle("stuck", window.scrollY>24); ticking=false; };
  window.addEventListener("scroll", function(){
    if(!ticking){ ticking=true; requestAnimationFrame(update); }
  }, {passive:true});
  update();
}

function boot(){
  var d=new Date();
  $("today").textContent = WD[d.getDay()]+", "+MO[d.getMonth()]+" "+d.getDate();

  var local=readLocal();
  if(local) state=local;
  applyAppearance();
  watchSystemTheme();
  watchScroll();
  render();

  Promise.all([loadRemote(),connect()]).then(function(res){
    var remote=res[0]; api=res[1];
    if(remote && (remote.updatedAt||0)>(state.updatedAt||0)){ state=remote; writeLocal(); render(); }
    mode = api ? "cloud" : "local";
    var hasContent = state.classes.length||state.tasks.length;
    var localNewer = !remote || (state.updatedAt||0)>(remote.updatedAt||0);
    if(api&&hasContent&&localNewer) scheduleSave(400);
    if($("settingsSheet").open) renderSettings();
  });
}

boot();
})();
</script>
