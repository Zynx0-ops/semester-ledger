<title>Semester Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,300..800;1,400&display=swap">

<style>
/* ---------------------------------------------------------------
   Semester Ledger — tokens
   Light palette on bare :root; dark redefines tokens only.
----------------------------------------------------------------*/
:root{
  --paper:#F1F4F4;
  --surface:#FBFCFC;
  --surface-2:#E8EDED;
  --rule:#D6DDDE;
  --rule-strong:#BAC5C7;
  --ink:#101618;
  --ink-2:#556468;
  --ink-3:#7C8B8F;
  --accent:#0E5A69;
  --accent-2:#0B7E93;
  --accent-ink:#FFFFFF;
  --danger:#A33529;
  --warn:#8E620E;
  --ok:#2C6B50;
  --grid:rgba(16,22,24,.05);
  --lift:0%;
  --shadow:0 1px 0 rgba(16,22,24,.04), 0 10px 28px -20px rgba(16,22,24,.55);
  --focus:#0B7E93;

  --f-display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0B0F10;
    --surface:#12191B;
    --surface-2:#1A2326;
    --rule:#233033;
    --rule-strong:#36474B;
    --ink:#E6EDEE;
    --ink-2:#94A5A9;
    --ink-3:#6E8085;
    --accent:#3FB4CC;
    --accent-2:#6FD2E6;
    --accent-ink:#04191E;
    --danger:#E8776A;
    --warn:#D9A445;
    --ok:#5FC496;
    --grid:rgba(230,237,238,.035);
    --lift:20%;
    --shadow:0 1px 0 rgba(0,0,0,.5), 0 12px 32px -22px rgba(0,0,0,.95);
    --focus:#6FD2E6;
  }
}
:root[data-theme="dark"]{
  --paper:#0B0F10;
  --surface:#12191B;
  --surface-2:#1A2326;
  --rule:#233033;
  --rule-strong:#36474B;
  --ink:#E6EDEE;
  --ink-2:#94A5A9;
  --ink-3:#6E8085;
  --accent:#3FB4CC;
  --accent-2:#6FD2E6;
  --accent-ink:#04191E;
  --danger:#E8776A;
  --warn:#D9A445;
  --ok:#5FC496;
  --grid:rgba(230,237,238,.035);
  --lift:20%;
  --shadow:0 1px 0 rgba(0,0,0,.5), 0 12px 32px -22px rgba(0,0,0,.95);
  --focus:#6FD2E6;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;
  font-family:var(--f-body);
  color:var(--ink);
  background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 28px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 100%,
    var(--paper);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}

.app{max-width:1160px;margin:0 auto;padding:clamp(18px,3.2vw,40px) clamp(14px,3vw,32px) 64px}

/* ---------------- header ---------------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 20px;padding-bottom:16px;border-bottom:1.5px solid var(--rule-strong);margin-bottom:26px}
.brand{flex:1 1 260px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4.4vw,42px);line-height:1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.today-line{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);margin:8px 0 0;font-variant-numeric:tabular-nums}
.status{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;white-space:nowrap}
.status .led{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.status[data-s="saved"] .led{background:var(--ok)}
.status[data-s="saving"] .led,.status[data-s="syncing"] .led{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
.status[data-s="local"] .led{background:var(--accent-2)}
.status[data-s="paused"] .led{background:var(--danger)}
@keyframes pulse{50%{opacity:.25}}

/* ---------------- layout ---------------- */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:30px;align-items:start}

/* ---------------- panels ---------------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--rule)}
.panel-title{font-family:var(--f-mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);margin:0}

/* ---------------- compose ---------------- */
.compose{display:grid;grid-template-columns:minmax(0,1fr) 150px 148px 108px auto;gap:8px;padding:14px 16px;align-items:center}
@media (max-width:760px){.compose{grid-template-columns:1fr 1fr;}.compose .f-title{grid-column:1/-1}.compose .f-add{grid-column:1/-1}}
.field{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:7px;padding:9px 11px;min-width:0}
.field::placeholder{color:var(--ink-3)}
.field:disabled{opacity:.5;cursor:not-allowed}
.field:focus{border-color:var(--accent-2);outline:none;box-shadow:0 0 0 3px color-mix(in oklab,var(--accent-2) 20%,transparent)}
input[type="date"].field,input[type="time"].field{font-family:var(--f-mono);font-size:13px}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:7px;padding:9px 18px;font-weight:600;cursor:pointer;letter-spacing:.01em;transition:filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-ghost{background:transparent;color:var(--ink-2);border:1px solid var(--rule);font-weight:500}
.btn-ghost:hover{color:var(--ink);border-color:var(--rule-strong);filter:none}

/* ---------------- task list ---------------- */
.bucket{margin-top:26px}
.bucket-head{display:flex;align-items:center;gap:10px;padding:0 2px 8px;border-bottom:1px solid var(--rule)}
.bucket-name{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.01em;margin:0}
.bucket-count{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-left:auto}
.bucket.is-overdue .bucket-name{color:var(--danger)}
.bucket.is-today .bucket-name{color:var(--accent)}

.tasks{list-style:none;margin:0;padding:0}
.task{
  --cc:color-mix(in oklab,white var(--lift),var(--c,#7C8B8F));
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;
  padding:12px 12px 12px 17px;position:relative;border-bottom:1px solid var(--rule);
}
.task::before{content:"";position:absolute;left:2px;top:11px;bottom:11px;width:3px;border-radius:2px;background:var(--cc)}
.task:hover{background:color-mix(in oklab,var(--surface-2) 55%,transparent)}

.tick{
  width:20px;height:20px;flex:none;margin-top:1px;border:1.75px solid var(--rule-strong);
  background:transparent;border-radius:4px;cursor:pointer;display:grid;place-items:center;padding:0;
  transition:border-color .15s,background .15s;
}
.tick:hover{border-color:var(--accent-2)}
.tick svg{width:13px;height:13px;stroke:var(--accent-ink);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .22s ease}
.tick[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.tick[aria-checked="true"] svg{stroke-dashoffset:0}

.t-title{display:block;font-weight:500;line-height:1.35;word-break:break-word}
.task.done .t-title{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.t-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:4px}
.t-class{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--cc);font-weight:600}
.t-when{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.t-when.late{color:var(--danger);font-weight:600}
.t-when.now{color:var(--accent);font-weight:600}

.t-acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.task:hover .t-acts,.task:focus-within .t-acts{opacity:1}
@media (hover:none){.t-acts{opacity:1}}
.icon{background:transparent;border:0;color:var(--ink-3);cursor:pointer;padding:5px;border-radius:6px;line-height:0}
.icon:hover{color:var(--ink);background:var(--surface-2)}
.icon.del:hover{color:var(--danger)}
.icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* inline edit */
.edit-row{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 148px 146px 106px auto auto;gap:8px;padding:10px 0 4px;align-items:center}
@media (max-width:760px){.edit-row{grid-template-columns:1fr 1fr}.edit-row .f-title{grid-column:1/-1}}

/* ---------------- rail ---------------- */
.rail{position:sticky;top:22px;display:flex;flex-direction:column;gap:18px}
.wheel-wrap{display:flex;flex-direction:column;align-items:center;padding:22px 16px 20px}
.wheel{position:relative;width:172px;height:172px}
.wheel svg{width:100%;height:100%;transform:rotate(-90deg)}
.wheel .track{stroke:var(--rule);fill:none;stroke-width:13}
.wheel .arc{stroke:var(--accent);fill:none;stroke-width:13;stroke-linecap:round;transition:stroke-dashoffset .55s cubic-bezier(.4,0,.2,1)}
.wheel-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.pct{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pct sup{font-size:17px;font-weight:600;color:var(--ink-2);vertical-align:super;margin-left:1px}
.frac{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.wheel-scope{margin-top:14px;font-family:var(--f-mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);text-align:center}

.classes{display:flex;flex-direction:column;padding:6px}
.cls-row{
  --cc:color-mix(in oklab,white var(--lift),var(--c,#7C8B8F));
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-radius:7px;
}
.cls-row:hover,.cls-row.active{background:var(--surface-2)}
.cls-row.solo{grid-template-columns:minmax(0,1fr)}
.cls{
  display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:0 9px;align-items:center;
  width:100%;text-align:left;background:transparent;border:0;border-radius:7px;padding:8px 6px 8px 9px;cursor:pointer;
}
.cls-dot{width:9px;height:9px;border-radius:2px;background:var(--cc)}
.cls-dot.all{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.cls-name{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cls-row.active .cls-name{font-weight:700}
.cls-frac{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cls-bar{grid-column:2/-1;height:3px;border-radius:2px;background:var(--rule);margin-top:6px;overflow:hidden}
.cls-bar i{display:block;height:100%;border-radius:2px;background:var(--cc);transition:width .45s cubic-bezier(.4,0,.2,1)}
.cls-x{background:transparent;border:0;color:var(--ink-3);cursor:pointer;padding:6px 9px;font-size:16px;line-height:1;opacity:0;border-radius:6px;transition:opacity .15s}
.cls-row:hover .cls-x,.cls-x:focus-visible{opacity:1}
.cls-x:hover{color:var(--danger);background:var(--surface)}
@media (hover:none){.cls-x{opacity:1}}

.cls-confirm{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--surface-2);border-radius:8px;margin:2px 0}
.cls-confirm p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.cls-confirm div{display:flex;gap:6px}
.mini{border-radius:6px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--rule-strong);background:transparent}
.mini.danger{background:var(--danger);border-color:var(--danger);color:#fff}

.addcls{padding:8px 9px 4px;border-top:1px solid var(--rule);margin-top:4px}
.addcls-toggle{width:100%;text-align:left;background:transparent;border:0;color:var(--ink-2);cursor:pointer;font-size:13px;padding:6px 0;font-weight:500}
.addcls-toggle:hover{color:var(--accent)}
.addcls-form{display:flex;flex-direction:column;gap:9px;padding:4px 0 8px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:22px;height:22px;border-radius:5px;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .12s}
.sw:hover{transform:scale(1.12)}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}

/* ---------------- misc ---------------- */
.empty{padding:36px 26px;text-align:center}
.empty h2{font-family:var(--f-display);font-size:20px;font-weight:700;margin:0 0 8px;letter-spacing:-.01em}
.empty p{margin:0 auto;max-width:44ch;color:var(--ink-2);font-size:14px;line-height:1.6}
.hint{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em;margin-top:14px}

.donebar{display:flex;align-items:center;gap:10px;margin-top:26px;padding-top:14px;border-top:1.5px solid var(--rule-strong)}
.donetoggle{background:transparent;border:0;color:var(--ink-2);cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;padding:4px 0;display:flex;align-items:center;gap:7px}
.donetoggle:hover{color:var(--ink)}
.donetoggle .caret{transition:transform .2s;display:inline-block}
.donetoggle[aria-expanded="true"] .caret{transform:rotate(90deg)}

.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:34px;padding-top:14px;border-top:1px solid var(--rule);font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:.05em}
.foot button{background:transparent;border:0;color:var(--ink-3);cursor:pointer;font:inherit;letter-spacing:inherit;text-decoration:underline;text-underline-offset:3px}
.foot button:hover{color:var(--accent)}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);
  padding:11px 16px;border-radius:9px;box-shadow:0 12px 32px -14px rgba(0,0,0,.6);font-size:13.5px;z-index:50;
  transition:opacity .2s,transform .2s;max-width:min(92vw,420px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:transparent;border:0;color:var(--accent-2);font-weight:700;cursor:pointer;font-size:13.5px;white-space:nowrap}

@media (max-width:920px){
  /* wheel, then the task list, then classes — summary first, detail next */
  .cols{display:flex;flex-direction:column;gap:22px;align-items:stretch}
  .rail{display:contents}
  .wheel-wrap{order:-1}
  main{order:0}
  .rail .panel:not(.wheel-wrap){order:1}
  .wheel-wrap{padding:18px 16px 16px}
  .wheel{width:134px;height:134px}
  .pct{font-size:34px}
  .pct sup{font-size:14px}
  .wheel-scope{margin-top:11px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <p class="eyebrow">Coursework &amp; deadlines</p>
      <h1>Semester Ledger</h1>
      <p class="today-line" id="todayLine"></p>
    </div>
    <div class="status" id="status" data-s="local" title="Where your planner is saved">
      <span class="led"></span><span id="statusText">Loading</span>
    </div>
  </header>

  <div class="cols">
    <main>
      <section class="panel">
        <div class="panel-head">
          <p class="panel-title">Add a task</p>
          <span class="panel-title" id="composeHint"></span>
        </div>
        <form class="compose" id="compose" autocomplete="off">
          <input class="field f-title" id="cTitle" name="title" placeholder="What's due? e.g. Chapter 7 problem set" maxlength="180" required>
          <select class="field" id="cClass" name="classId" aria-label="Class"></select>
          <input class="field" id="cDate" name="due" type="date" aria-label="Due date">
          <input class="field" id="cTime" name="time" type="time" aria-label="Due time">
          <button class="btn f-add" type="submit">Add</button>
        </form>
      </section>

      <div id="list"></div>

      <div class="donebar" id="doneBar" hidden>
        <button class="donetoggle" id="doneToggle" aria-expanded="false">
          <span class="caret">&#9656;</span><span id="doneLabel">Completed</span>
        </button>
      </div>
      <div id="doneList"></div>

      <div class="foot">
        <span id="footCount"></span>
        <span><button type="button" id="exportBtn" hidden>Download a backup</button></span>
      </div>
    </main>

    <aside class="rail">
      <section class="panel wheel-wrap">
        <div class="wheel">
          <svg viewBox="0 0 160 160" aria-hidden="true">
            <circle class="track" cx="80" cy="80" r="66"></circle>
            <circle class="arc" id="arc" cx="80" cy="80" r="66" stroke-dasharray="414.69" stroke-dashoffset="414.69"></circle>
          </svg>
          <div class="wheel-mid">
            <span class="pct" id="pct">0<sup>%</sup></span>
            <span class="frac" id="frac">0 of 0 done</span>
          </div>
        </div>
        <p class="wheel-scope" id="scope">All classes</p>
      </section>

      <section class="panel">
        <div class="panel-head"><p class="panel-title">Classes</p></div>
        <div class="classes" id="classes"></div>
        <div class="addcls">
          <button class="addcls-toggle" id="addClsToggle" type="button">+ Add a class</button>
          <form class="addcls-form" id="addClsForm" hidden>
            <input class="field" id="clsName" placeholder="e.g. AP Biology" maxlength="40" required>
            <div class="swatches" id="swatches"></div>
            <div style="display:flex;gap:7px">
              <button class="btn" type="submit" style="flex:1;padding:8px">Add class</button>
              <button class="btn btn-ghost" type="button" id="clsCancel" style="padding:8px 12px">Cancel</button>
            </div>
          </form>
        </div>
      </section>
    </aside>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span><button type="button" id="toastAction" hidden></button>
</div>

<script>
(function(){
"use strict";

/* ============ constants ============ */
var PALETTE = ["#C2453A","#C2761A","#7E8F1E","#2E8B62","#1E7FA6","#4B5BC4","#8E4FB0","#BE4A83"];
var LS_KEY = "semester-ledger/v1";
var DATA_PATH = "data/planner.json";
var WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var BUCKETS = [
  ["overdue","Overdue"],["today","Today"],["tomorrow","Tomorrow"],
  ["week","This week"],["later","Upcoming"],["someday","No date set"]
];

/* ============ state ============ */
var state = blank();
var filter = "all";
var showDone = false;
var editingId = null;
var confirmClsId = null;
var pickedColor = PALETTE[0];

var api = null;          // artifact capability namespace
var mode = "local";      // "cloud" | "local"
var saveTimer = null;
var backoff = 1400;
var retried = false;
var undo = null;
var toastTimer = null;

function blank(){ return { v:1, classes:[], tasks:[], updatedAt:0 }; }

/* ============ small utils ============ */
function $(id){ return document.getElementById(id); }
function pad(n){ return String(n).length < 2 ? "0"+n : String(n); }
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function isoOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseISO(iso){ var p = iso.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function shiftISO(iso, n){ var d = parseISO(iso); d.setDate(d.getDate()+n); return isoOf(d); }

var TODAY = isoOf(new Date());
var TOMORROW = shiftISO(TODAY,1);
var WEEK_END = shiftISO(TODAY,7);

function fmtDate(iso){
  if(!iso) return "No date";
  if(iso === TODAY) return "Today";
  if(iso === TOMORROW) return "Tomorrow";
  if(iso === shiftISO(TODAY,-1)) return "Yesterday";
  var d = parseISO(iso);
  var s = WD[d.getDay()] + ", " + MO[d.getMonth()] + " " + d.getDate();
  if(d.getFullYear() !== new Date().getFullYear()) s += " " + d.getFullYear();
  return s;
}
function fmtTime(t){
  if(!t) return "";
  var p = t.split(":"), h = +p[0], m = p[1];
  var ap = h >= 12 ? "PM" : "AM";
  h = h % 12; if(h === 0) h = 12;
  return h + ":" + m + " " + ap;
}
function classOf(id){
  for(var i=0;i<state.classes.length;i++) if(state.classes[i].id === id) return state.classes[i];
  return null;
}
function taskOf(id){
  for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].id === id) return state.tasks[i];
  return null;
}
function bucketOf(t){
  if(t.done) return "done";
  if(!t.due) return "someday";
  if(t.due < TODAY) return "overdue";
  if(t.due === TODAY) return "today";
  if(t.due === TOMORROW) return "tomorrow";
  if(t.due <= WEEK_END) return "week";
  return "later";
}
function byDue(a,b){
  if(!a.due !== !b.due) return a.due ? -1 : 1;
  if(a.due !== b.due) return a.due < b.due ? -1 : 1;
  if(!a.time !== !b.time) return a.time ? -1 : 1;
  if(a.time !== b.time) return a.time < b.time ? -1 : 1;
  return (a.createdAt||0) - (b.createdAt||0);
}

/* ============ persistence ============ */
function readLocal(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    return normalize(JSON.parse(raw));
  }catch(e){ return null; }
}
function writeLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}
function normalize(o){
  if(!o || typeof o !== "object") return null;
  var classes = Array.isArray(o.classes) ? o.classes : [];
  var tasks = Array.isArray(o.tasks) ? o.tasks : [];
  var out = { v:1, classes:[], tasks:[], updatedAt: +o.updatedAt || 0 };
  classes.forEach(function(c){
    if(c && c.id && c.name) out.classes.push({ id:String(c.id), name:String(c.name).slice(0,60), color:String(c.color||PALETTE[0]) });
  });
  tasks.forEach(function(t){
    if(!t || !t.id || !t.title) return;
    out.tasks.push({
      id:String(t.id), classId: t.classId ? String(t.classId) : null,
      title:String(t.title).slice(0,300),
      due: t.due ? String(t.due).slice(0,10) : null,
      time: t.time ? String(t.time).slice(0,5) : null,
      done: !!t.done, doneAt: t.doneAt || null, createdAt: +t.createdAt || 0
    });
  });
  return out;
}

function setStatus(s){
  var map = { saved:"Synced", saving:"Saving", syncing:"Updating", local:"On this device", paused:"Sync paused" };
  var titles = {
    saved:"Your planner is saved with the page — it will be here on any device.",
    saving:"Saving your changes.",
    syncing:"A newer version was published; this page is catching up.",
    local:"Saved in this browser. Download a backup to keep a copy.",
    paused:"Couldn't reach saving. Your work is safe in this browser."
  };
  var el = $("status");
  el.setAttribute("data-s", s);
  el.title = titles[s] || "";
  $("statusText").textContent = map[s] || s;
}

function scheduleSave(delay){
  if(mode !== "cloud" || !api) return;
  setStatus("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, delay === undefined ? 1400 : delay);
}

var PERMANENT = ["not_writer","not_granted","not_declared","capability_disabled",
                 "capability_removed","consent_required","invalid_content",
                 "transform_error","read_only_path","too_large"];

function doSave(){
  if(!api) return;
  var files = {};
  files[DATA_PATH] = JSON.stringify(state);
  api.publish(files).then(function(){
    setStatus("saved"); backoff = 1400; retried = false;
  }, function(err){
    var code = (err && err.code) || "upstream_error";
    if(code === "conflict"){ setStatus("syncing"); return; }
    if(PERMANENT.indexOf(code) !== -1){ mode = "local"; api = null; setStatus("local"); return; }
    if(code === "rate_limited"){ backoff = Math.min(backoff*2, 20000); scheduleSave(backoff); return; }
    if(!retried){ retried = true; scheduleSave(1200 + Math.random()*1500); return; }
    setStatus("paused");
  });
}

/* every mutation goes through here */
function commit(){
  state.updatedAt = Date.now();
  writeLocal();
  render();
  scheduleSave();
}

/* ============ rendering ============ */
function inScope(t){ return filter === "all" || t.classId === filter; }

function render(){
  renderClasses();
  renderComposeClasses();
  renderList();
  updateWheel();
  renderFoot();
}

function renderComposeClasses(){
  var sel = $("cClass");
  var keep = sel.value;
  var html = "";
  if(!state.classes.length){
    html = '<option value="">No classes yet</option>';
  }else{
    state.classes.forEach(function(c){
      html += '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>';
    });
  }
  sel.innerHTML = html;
  if(keep && classOf(keep)) sel.value = keep;
  else if(filter !== "all" && classOf(filter)) sel.value = filter;

  var none = !state.classes.length;
  sel.disabled = none;
  $("cTitle").disabled = none;
  $("cDate").disabled = none;
  $("cTime").disabled = none;
  $("compose").querySelector("button[type=submit]").disabled = none;
  $("composeHint").textContent = none ? "Add a class first" : "";
}

function progressFor(list){
  var total = list.length, done = 0;
  for(var i=0;i<list.length;i++) if(list[i].done) done++;
  return { total:total, done:done, pct: total ? Math.round(done/total*100) : 0 };
}

function renderClasses(){
  var wrap = $("classes");
  var all = progressFor(state.tasks);
  var html = "";

  html += '<div class="cls-row solo'+(filter==="all"?" active":"")+'">'
        + '<button class="cls" data-act="filter" data-id="all" aria-pressed="'+(filter==="all")+'">'
        + '<span class="cls-dot all"></span>'
        + '<span class="cls-name">All classes</span>'
        + '<span class="cls-frac">'+all.done+"/"+all.total+'</span>'
        + '<span class="cls-bar"><i style="width:'+all.pct+'%"></i></span>'
        + '</button></div>';

  state.classes.forEach(function(c){
    if(confirmClsId === c.id){
      var n = state.tasks.filter(function(t){ return t.classId === c.id; }).length;
      html += '<div class="cls-confirm"><p>Delete <strong>'+esc(c.name)+"</strong>"
            + (n ? " and its "+n+" task"+(n===1?"":"s") : "")+"?</p>"
            + '<div><button class="mini danger" data-act="cls-del-yes" data-id="'+esc(c.id)+'">Delete</button>'
            + '<button class="mini" data-act="cls-del-no">Keep</button></div></div>';
      return;
    }
    var list = state.tasks.filter(function(t){ return t.classId === c.id; });
    var p = progressFor(list);
    html += '<div class="cls-row'+(filter===c.id?" active":"")+'" style="--c:'+esc(c.color)+'">'
          + '<button class="cls" data-act="filter" data-id="'+esc(c.id)+'" aria-pressed="'+(filter===c.id)+'">'
          + '<span class="cls-dot"></span>'
          + '<span class="cls-name">'+esc(c.name)+'</span>'
          + '<span class="cls-frac">'+p.done+"/"+p.total+'</span>'
          + '<span class="cls-bar"><i style="width:'+p.pct+'%"></i></span>'
          + '</button>'
          + '<button class="cls-x" data-act="cls-del" data-id="'+esc(c.id)+'" aria-label="Delete '+esc(c.name)+'">&times;</button>'
          + '</div>';
  });

  wrap.innerHTML = html;
}

function taskHTML(t){
  var c = classOf(t.classId);
  var color = c ? c.color : "#7C8B8F";
  var when = "";
  if(t.due || t.time){
    var cls = "t-when";
    if(!t.done){
      if(t.due && t.due < TODAY) cls += " late";
      else if(t.due === TODAY) cls += " now";
    }
    var txt = t.due ? fmtDate(t.due) : "";
    if(t.time) txt += (txt ? " · " : "") + fmtTime(t.time);
    when = '<span class="'+cls+'">'+esc(txt)+"</span>";
  }
  var meta = "";
  if(c) meta += '<span class="t-class">'+esc(c.name)+"</span>";
  meta += when;

  var h = '<li class="task'+(t.done?" done":"")+'" style="--c:'+esc(color)+'" data-tid="'+esc(t.id)+'">'
    + '<button class="tick" role="checkbox" aria-checked="'+(t.done?"true":"false")+'" data-act="toggle" data-id="'+esc(t.id)+'" aria-label="Mark '+esc(t.title)+' '+(t.done?"not done":"done")+'">'
    + '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg></button>'
    + '<div><span class="t-title">'+esc(t.title)+"</span>"
    + (meta ? '<span class="t-meta">'+meta+"</span>" : "")
    + "</div>"
    + '<div class="t-acts">'
    + '<button class="icon" data-act="edit" data-id="'+esc(t.id)+'" aria-label="Edit task"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>'
    + '<button class="icon del" data-act="del" data-id="'+esc(t.id)+'" aria-label="Delete task"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></button>'
    + "</div>";

  if(editingId === t.id){
    var opts = state.classes.map(function(c2){
      return '<option value="'+esc(c2.id)+'"'+(c2.id===t.classId?" selected":"")+">"+esc(c2.name)+"</option>";
    }).join("");
    h += '<form class="edit-row" data-act="save-edit" data-id="'+esc(t.id)+'">'
      + '<input class="field f-title" name="title" value="'+esc(t.title)+'" maxlength="180" required>'
      + '<select class="field" name="classId" aria-label="Class">'+opts+"</select>"
      + '<input class="field" name="due" type="date" value="'+esc(t.due||"")+'" aria-label="Due date">'
      + '<input class="field" name="time" type="time" value="'+esc(t.time||"")+'" aria-label="Due time">'
      + '<button class="btn" type="submit" style="padding:9px 14px">Save</button>'
      + '<button class="btn btn-ghost" type="button" data-act="cancel-edit" style="padding:9px 12px">Cancel</button>'
      + "</form>";
  }
  return h + "</li>";
}

function renderList(){
  var host = $("list");

  if(!state.classes.length){
    host.innerHTML = '<section class="panel empty" style="margin-top:26px">'
      + "<h2>Start with your classes</h2>"
      + "<p>Add each class you’re taking this term — every task lives under one, and each gets its own colour and progress bar.</p>"
      + '<p class="hint">Use “+ Add a class” in the sidebar</p></section>';
    $("doneBar").hidden = true;
    $("doneList").innerHTML = "";
    return;
  }

  var open = state.tasks.filter(function(t){ return !t.done && inScope(t); });
  var groups = {};
  open.forEach(function(t){
    var b = bucketOf(t);
    (groups[b] = groups[b] || []).push(t);
  });

  var html = "";
  BUCKETS.forEach(function(pair){
    var key = pair[0], label = pair[1];
    var list = groups[key];
    if(!list || !list.length) return;
    list.sort(byDue);
    html += '<section class="bucket is-'+key+'">'
      + '<div class="bucket-head"><h2 class="bucket-name">'+label+"</h2>"
      + '<span class="bucket-count">'+list.length+"</span></div>"
      + '<ul class="tasks">' + list.map(taskHTML).join("") + "</ul></section>";
  });

  if(!open.length){
    var scopeName = filter === "all" ? "" : (classOf(filter) ? " in " + classOf(filter).name : "");
    var anyDone = state.tasks.some(function(t){ return t.done && inScope(t); });
    html = '<section class="panel empty" style="margin-top:26px"><h2>'
      + (anyDone ? "All clear" : "Nothing scheduled")
      + "</h2><p>"
      + (anyDone
          ? "Every task"+esc(scopeName)+" is checked off. Add the next one above."
          : "No open tasks"+esc(scopeName)+" yet — add one above to get started.")
      + "</p></section>";
  }
  host.innerHTML = html;

  var done = state.tasks.filter(function(t){ return t.done && inScope(t); });
  $("doneBar").hidden = !done.length;
  $("doneToggle").setAttribute("aria-expanded", showDone ? "true" : "false");
  $("doneLabel").textContent = "Completed · " + done.length;
  if(showDone && done.length){
    done.sort(function(a,b){ return (b.doneAt||0) - (a.doneAt||0); });
    $("doneList").innerHTML = '<ul class="tasks">' + done.map(taskHTML).join("") + "</ul>";
  }else{
    $("doneList").innerHTML = "";
  }
}

var R = 66, CIRC = 2 * Math.PI * R;
function updateWheel(){
  var p = progressFor(state.tasks.filter(inScope));
  var arc = $("arc");
  arc.setAttribute("stroke-dasharray", CIRC.toFixed(2));
  arc.setAttribute("stroke-dashoffset", (CIRC * (1 - p.pct/100)).toFixed(2));
  $("pct").innerHTML = p.pct + "<sup>%</sup>";
  $("frac").textContent = p.total
    ? p.done + " of " + p.total + " done"
    : "no tasks yet";
  var c = filter === "all" ? null : classOf(filter);
  $("scope").textContent = c ? c.name : "All classes";
}

function renderFoot(){
  var open = state.tasks.filter(function(t){ return !t.done; }).length;
  var late = state.tasks.filter(function(t){ return !t.done && t.due && t.due < TODAY; }).length;
  var s = open + " open task" + (open===1?"":"s");
  if(late) s += " · " + late + " overdue";
  $("footCount").textContent = s;
}

/* ============ toast ============ */
function toast(msg, actionLabel, fn){
  var el = $("toast");
  $("toastMsg").textContent = msg;
  var b = $("toastAction");
  if(actionLabel){
    b.hidden = false; b.textContent = actionLabel;
    b.onclick = function(){ hideToast(); fn && fn(); };
  }else{ b.hidden = true; b.onclick = null; }
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 6000);
}
function hideToast(){ $("toast").classList.remove("show"); }

/* ============ actions ============ */
document.addEventListener("click", function(e){
  if(!e.target || !e.target.closest) return;
  var el = e.target.closest("[data-act]");
  if(!el || el.tagName === "FORM") return;
  var act = el.getAttribute("data-act");
  var id = el.getAttribute("data-id");

  if(act === "toggle"){
    var t = taskOf(id); if(!t) return;
    t.done = !t.done;
    t.doneAt = t.done ? Date.now() : null;
    var hadFocus = document.activeElement === el;
    commit();
    if(hadFocus){
      var again = document.querySelector('.tick[data-id="'+id+'"]');
      if(again) again.focus();
    }
  }
  else if(act === "filter"){
    filter = id; confirmClsId = null; render();
  }
  else if(act === "edit"){
    editingId = (editingId === id) ? null : id;
    renderList();
    var f = document.querySelector('.edit-row [name="title"]');
    if(f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
  }
  else if(act === "cancel-edit"){
    editingId = null; renderList();
  }
  else if(act === "del"){
    var idx = state.tasks.findIndex(function(t){ return t.id === id; });
    if(idx < 0) return;
    var removed = state.tasks[idx];
    state.tasks.splice(idx, 1);
    if(editingId === id) editingId = null;
    commit();
    toast("Deleted “" + removed.title + "”", "Undo", function(){
      state.tasks.splice(Math.min(idx, state.tasks.length), 0, removed);
      commit();
    });
  }
  else if(act === "cls-del"){
    e.stopPropagation();
    confirmClsId = id; renderClasses();
  }
  else if(act === "cls-del-yes"){
    state.tasks = state.tasks.filter(function(t){ return t.classId !== id; });
    state.classes = state.classes.filter(function(c){ return c.id !== id; });
    if(filter === id) filter = "all";
    confirmClsId = null;
    commit();
  }
  else if(act === "cls-del-no"){
    confirmClsId = null; renderClasses();
  }
});

/* add task */
$("compose").addEventListener("submit", function(e){
  e.preventDefault();
  var title = $("cTitle").value.trim();
  if(!title || !state.classes.length) return;
  state.tasks.push({
    id: uid(),
    classId: $("cClass").value || state.classes[0].id,
    title: title,
    due: $("cDate").value || null,
    time: $("cTime").value || null,
    done: false, doneAt: null, createdAt: Date.now()
  });
  $("cTitle").value = "";
  commit();
  $("cTitle").focus();
});

/* save an inline edit */
document.addEventListener("submit", function(e){
  var f = e.target;
  if(f.getAttribute && f.getAttribute("data-act") === "save-edit"){
    e.preventDefault();
    var t = taskOf(f.getAttribute("data-id"));
    if(!t) return;
    var title = f.elements.title.value.trim();
    if(!title) return;
    t.title = title;
    t.classId = f.elements.classId.value || t.classId;
    t.due = f.elements.due.value || null;
    t.time = f.elements.time.value || null;
    editingId = null;
    commit();
  }
});

/* Enter submits the form the field belongs to; Escape leaves an edit */
document.addEventListener("keydown", function(e){
  var t = e.target;
  if(!t || t.tagName !== "INPUT") return;
  if(e.key === "Escape" && editingId && t.closest(".edit-row")){
    e.preventDefault(); editingId = null; renderList(); return;
  }
  if(e.key !== "Enter" || e.shiftKey || e.isComposing) return;
  if(["text","date","time"].indexOf(t.type) === -1) return;
  var form = t.form || t.closest("form");
  if(!form) return;
  e.preventDefault();
  if(form.requestSubmit) form.requestSubmit();
  else form.dispatchEvent(new Event("submit", { cancelable:true, bubbles:true }));
});

/* completed section */
$("doneToggle").addEventListener("click", function(){
  showDone = !showDone; renderList();
});

/* add class */
$("addClsToggle").addEventListener("click", function(){
  var f = $("addClsForm");
  f.hidden = !f.hidden;
  $("addClsToggle").textContent = f.hidden ? "+ Add a class" : "New class";
  if(!f.hidden) $("clsName").focus();
});
$("clsCancel").addEventListener("click", function(){
  $("addClsForm").hidden = true;
  $("addClsToggle").textContent = "+ Add a class";
});
$("addClsForm").addEventListener("submit", function(e){
  e.preventDefault();
  var name = $("clsName").value.trim();
  if(!name) return;
  var c = { id: uid(), name: name, color: pickedColor };
  state.classes.push(c);
  $("clsName").value = "";
  pickedColor = PALETTE[state.classes.length % PALETTE.length];
  buildSwatches();
  commit();
  $("clsName").focus();
});

function buildSwatches(){
  var wrap = $("swatches");
  wrap.innerHTML = PALETTE.map(function(c){
    return '<button type="button" class="sw" data-color="'+c+'" style="background:'+c+'" aria-pressed="'
      + (c === pickedColor) + '" aria-label="Colour '+c+'"></button>';
  }).join("");
}
$("swatches").addEventListener("click", function(e){
  var b = e.target.closest(".sw"); if(!b) return;
  pickedColor = b.getAttribute("data-color");
  buildSwatches();
});

/* flush pending save when the tab goes away */
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "hidden" && saveTimer){
    clearTimeout(saveTimer); saveTimer = null; doSave();
  }
});

/* ============ boot ============ */
function loadRemote(){
  return fetch(DATA_PATH, { cache:"no-store" }).then(function(r){
    if(!r.ok) return null;
    return r.text();
  }).then(function(txt){
    if(!txt) return null;
    return normalize(JSON.parse(txt));
  }).catch(function(){ return null; });
}
function connect(){
  try{
    if(!(window.claude && typeof window.claude.use === "function")) return Promise.resolve(null);
    return window.claude.use("artifact").catch(function(){ return null; });
  }catch(e){ return Promise.resolve(null); }
}

function boot(){
  var d = new Date();
  $("todayLine").textContent = WD[d.getDay()] + ", " + MO[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();

  pickedColor = PALETTE[0];
  buildSwatches();

  var local = readLocal();
  if(local) state = local;
  setStatus("local");
  render();

  Promise.all([loadRemote(), connect()]).then(function(res){
    var remote = res[0];
    api = res[1];

    if(remote && (remote.updatedAt || 0) > (state.updatedAt || 0)){
      state = remote; writeLocal(); render();
    }

    mode = api ? "cloud" : "local";
    setStatus(api ? "saved" : "local");

    // local work made while offline (or before the data file existed) — push it up
    var hasContent = state.classes.length || state.tasks.length;
    var localNewer = !remote || (state.updatedAt || 0) > (remote.updatedAt || 0);
    if(api && hasContent && localNewer) scheduleSave(400);
  });

  // backup download, only if the viewer can actually receive a file
  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("downloads").then(function(dl){
      if(!dl) return;
      var b = $("exportBtn");
      b.hidden = false;
      b.addEventListener("click", function(){
        dl.save({ filename:"semester-ledger.json", data: JSON.stringify(state, null, 2) })
          .catch(function(){ toast("Download declined — nothing was saved."); });
      });
    }).catch(function(){});
  }
}

boot();
})();
</script>
